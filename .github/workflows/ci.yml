name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      initial_deployment:
        description: 'First activation only: no prior live release or traffic exists'
        required: false
        default: false
        type: boolean
      publish_image_only:
        description: 'Publish a smoke-tested immutable image without requiring or changing the Web App'
        required: false
        default: false
        type: boolean
permissions:
  contents: read

env:
  DEPLOYMENT_CONTRACT_VERSION: p1-11-v1
  DEPLOYMENT_PROFILE: sqlite-one-worker
  INITIAL_DEPLOYMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.initial_deployment && 'true' || 'false' }}
  PUBLISH_IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image_only && 'true' || 'false' }}
  RG: rg-personal-apps-prod
  ACR: acrenzolopez01
  ACR_LOGIN_SERVER: acrenzolopez01.azurecr.io
  IMAGE_REPOSITORY: shapepilot
  WEBAPP: app-shapepilot-prod-lwxhu7jxlrbtu
  PRODUCTION_URL: https://app-shapepilot-prod-lwxhu7jxlrbtu.azurewebsites.net
  LIVE_PATH: /api/live
  READY_PATH: /api/ready
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: de625678-c55b-4494-9558-14946cbb6133
  AZURE_SUBSCRIPTION_ID: 1cf02211-8d77-4658-bb6a-0f83ec831c3b
  VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
  VITE_AZURE_TENANT_ID: 52188f12-db6b-46c6-88ff-08c802f0ed3b
  REQUIRED_CONFIRMATIONS: '3'
  MAX_ATTEMPTS: '120'
  ROLLBACK_MAX_ATTEMPTS: '120'
  POLL_INTERVAL_SECONDS: '5'
  HTTP_TIMEOUT_SECONDS: '8'
  ROLLBACK_CANCELLED: 'false'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install with lifecycle scripts
        run: npm ci --no-audit --no-fund

      - name: Run strict source gates once
        run: npm run ci:source

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(sqlite|sqlite3|db)(-|$)|-(journal|wal|shm)$|(^|/)(dist|coverage|native/build|\.recovery-work|artifacts?)(/|$)'; then
            echo "::error::Tracked runtime artifact detected"
            exit 1
          fi

  diagnostics_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0

      - name: Audit full dependency tree
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-dependency-audit
          category: source-audit
          phase: pre-build
          report: reports/npm-audit.json
          report-format: npm-audit-json
          run: |
            set -euo pipefail
            mkdir -p reports
            npm audit --audit-level=high --json > reports/npm-audit.json

      - name: Audit production dependency tree
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: production-dependency-audit
          category: source-audit
          phase: pre-build
          report: reports/npm-audit-production.json
          report-format: npm-audit-json
          run: |
            set -euo pipefail
            mkdir -p reports
            npm audit --omit=dev --audit-level=high --json > reports/npm-audit-production.json

      - name: Generate source SBOM from the exact lockfile
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-sbom
          category: sbom
          phase: pre-build
          report: reports/source-sbom.cdx.json
          report-format: cyclonedx-json
          run: |
            set -euo pipefail
            mkdir -p reports
            npm sbom --package-lock-only --sbom-format=cyclonedx > reports/source-sbom.cdx.json
            jq -e 'type == "object" and .bomFormat == "CycloneDX"' \
              reports/source-sbom.cdx.json > /dev/null

      - name: Summarize source diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-build
          mode: aggregate

      - name: Upload source diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-diagnostics/
            reports/
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_id: ${{ steps.inspected.outputs.image_id }}
      build_id: ${{ steps.identity.outputs.build_id }}
      image: ${{ steps.identity.outputs.image }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    env:
      IMAGE: shapepilot-ci:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER: shapepilot-ci-${{ github.run_id }}-${{ github.run_attempt }}
      VOLUME: shapepilot-ci-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_NUMBER_BASELINE: 37
      # Public SPA identity: PRs exercise the same client configuration as main.
      VITE_AZURE_CLIENT_ID: 60b0b8cf-f1e2-4ba4-b89b-7d6dc3358251
      TEST_TENANT_ID: 52188f12-db6b-46c6-88ff-08c802f0ed3b
      TEST_CLIENT_ID: 60b0b8cf-f1e2-4ba4-b89b-7d6dc3358251
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare immutable build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_ID" =~ ^[0-9]+-[0-9]+$ ]]
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER - BUILD_NUMBER_BASELINE ))
          [[ "$BUILD_NUMBER" -gt 0 ]]
          commit_timestamp="$(
            git show -s --format=%cI "$GITHUB_SHA" |
              xargs -I{} node -e 'console.log(new Date(process.argv[1]).toISOString())' '{}'
          )"
          {
            echo "build_id=$BUILD_ID"
            echo "image=$IMAGE"
            echo "artifact_name=candidate-image-$GITHUB_SHA-$BUILD_ID"
            echo "build_number=$BUILD_NUMBER"
            echo "timestamp=$commit_timestamp"
          } >> "$GITHUB_OUTPUT"

      - name: Set up cached image builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build pinned Linux image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=shapepilot-linux-amd64
          cache-to: type=gha,mode=max,scope=shapepilot-linux-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_ID=${{ env.BUILD_ID }}
            BUILD_NUMBER=${{ steps.identity.outputs.build_number }}
            BUILD_TIMESTAMP=${{ steps.identity.outputs.timestamp }}
            VITE_AZURE_CLIENT_ID=${{ env.VITE_AZURE_CLIENT_ID }}
            VITE_AZURE_TENANT_ID=${{ env.VITE_AZURE_TENANT_ID }}
            VITE_API_SCOPE=api://60b0b8cf-f1e2-4ba4-b89b-7d6dc3358251/access_as_user

      - name: Inspect candidate identity and storage layout
        id: inspected
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" == "node" ]]
          docker image inspect "$IMAGE" --format '{{json .Config.Volumes}}' |
            jq -e '[((. // {}) | keys[]) |
              select(. == "/home" or startswith("/home/"))] | length == 0'
          [[ "$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            == "$GITHUB_SHA" ]]
          [[ "$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" \
            == "$BUILD_ID" ]]
          image_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Smoke native SQLite and production endpoints
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$VOLUME" > /dev/null

          common_env=(
            --env "AAD_TENANT_ID=$TEST_TENANT_ID"
            --env "SHAPEPILOT_ENTRA_TENANT_ID=$TEST_TENANT_ID"
            --env "SHAPEPILOT_API_AUDIENCE=api://$TEST_CLIENT_ID"
            --env "SHAPEPILOT_API_SCOPE=access_as_user"
          )
          docker run --rm \
            --user 0 \
            --mount "type=volume,source=$VOLUME,target=/home/data" \
            "$IMAGE" \
            chown node:node /home/data

          docker run --detach \
            --name "$CONTAINER" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=volume,source=$VOLUME,target=/home/data" \
            "${common_env[@]}" \
            --env SHAPEPILOT_INITIALIZE_EMPTY_DB=1 \
            "$IMAGE" > /dev/null

          docker exec "$CONTAINER" node scripts/verify-deployment.mjs \
            --base-url http://127.0.0.1:3000 \
            --live-path /api/live \
            --ready-path /api/ready \
            --profile sqlite-one-worker \
            --expected-sha "$GITHUB_SHA" \
            --expected-build-id "$BUILD_ID" \
            --attempts 30 \
            --confirmations 3 \
            --interval-ms 1000 \
            --request-timeout-ms 3000 \
            --run-token "ci-$BUILD_ID"

          docker exec "$CONTAINER" node --input-type=module -e "
            import { existsSync, readFileSync, statSync } from 'node:fs';
            import Database from 'better-sqlite3';
            import { EMPTY_SEED_DOMAIN_TABLES } from './server/emptySeed.ts';
            const markerPath = '/home/data/.shapepilot-empty-seed.json';
            for (const path of [process.env.DB_PATH, markerPath]) {
              const stat = statSync(path);
              if (stat.uid !== 1000 || stat.gid !== 1000 || (stat.mode & 0o777) !== 0o600) {
                throw new Error('bootstrap authority ownership or mode is invalid');
              }
            }
            const marker = JSON.parse(readFileSync(markerPath, 'utf8'));
            if (marker.sourceSha !== '$GITHUB_SHA' || marker.buildId !== '$BUILD_ID') {
              throw new Error('bootstrap marker build identity is invalid');
            }
            const db = new Database(process.env.DB_PATH, {
              readonly: true,
              fileMustExist: true,
            });
            db.pragma('query_only = ON');
            if (String(db.pragma('journal_mode', { simple: true })).toLowerCase() !== 'delete') {
              throw new Error('journal mode is not DELETE');
            }
            if (db.pragma('foreign_keys', { simple: true }) !== 1) {
              throw new Error('foreign keys are not enabled');
            }
            if (existsSync(process.env.DB_PATH + '-wal') || existsSync(process.env.DB_PATH + '-shm')) {
              throw new Error('WAL sidecars exist');
            }
            for (const table of EMPTY_SEED_DOMAIN_TABLES) {
              if (db.prepare('SELECT COUNT(*) AS count FROM ' + table).get().count !== 0) {
                throw new Error('bootstrap inserted a domain row into ' + table);
              }
            }
            db.close();
          "

          docker rm --force "$CONTAINER" > /dev/null
          docker run --detach \
            --name "$CONTAINER" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=volume,source=$VOLUME,target=/home/data" \
            "${common_env[@]}" \
            "$IMAGE" > /dev/null
          docker exec "$CONTAINER" node scripts/verify-deployment.mjs \
            --base-url http://127.0.0.1:3000 \
            --live-path /api/live \
            --ready-path /api/ready \
            --profile sqlite-one-worker \
            --expected-sha "$GITHUB_SHA" \
            --expected-build-id "$BUILD_ID" \
            --attempts 30 \
            --confirmations 3 \
            --interval-ms 1000 \
            --request-timeout-ms 3000 \
            --run-token "ci-restart-$BUILD_ID"

      - name: Save the smoke-tested image
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: docker save --output "$RUNNER_TEMP/shapepilot-image.tar" "$IMAGE"

      - name: Transfer the smoke-tested image
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/shapepilot-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [quality, container]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      ref: ${{ steps.image.outputs.ref }}
      build_id: ${{ steps.image.outputs.build_id }}
      image_id: ${{ steps.image.outputs.image_id }}
    env:
      IMAGE: ${{ needs.container.outputs.image }}
      BUILD_ID: ${{ needs.container.outputs.build_id }}
      SMOKE_TESTED_IMAGE_ID: ${{ needs.container.outputs.image_id }}
    steps:
      - name: Download the smoke-tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.container.outputs.artifact_name }}
          path: ${{ runner.temp }}

      - name: Validate immutable publication inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_ID" =~ ^$GITHUB_RUN_ID-[0-9]+$ ]]
          [[ "$SMOKE_TESTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID" =~ $guid ]]
          [[ "$VITE_AZURE_CLIENT_ID" == "60b0b8cf-f1e2-4ba4-b89b-7d6dc3358251" ]]
          [[ ! ("$INITIAL_DEPLOYMENT" == "true" && "$PUBLISH_IMAGE_ONLY" == "true") ]]
          docker load --input "$RUNNER_TEMP/shapepilot-image.tar"
          if [[ "$(docker image inspect "$IMAGE" --format '{{.Id}}')" != "$SMOKE_TESTED_IMAGE_ID" ]]; then
            echo "::error::Transferred image differs from the smoke-tested image"
            exit 1
          fi
          [[ "$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          [[ "$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" == "$BUILD_ID" ]]

      - name: Azure login with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Push the smoke-tested image and resolve its exact digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="$GITHUB_SHA-$BUILD_ID"
          candidate="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$candidate_tag"
          actual_acr_login_server="$(az acr show \
            --name "$ACR" --query loginServer --output tsv)"
          [[ "$actual_acr_login_server" == "$ACR_LOGIN_SERVER" ]]
          repository_exists="$(az acr repository list \
            --name "$ACR" \
            --query "contains(@, '$IMAGE_REPOSITORY')" \
            --output tsv)"
          existing_candidate_count=0
          if [[ "$repository_exists" == "true" ]]; then
            existing_candidate_count="$(az acr repository show-tags \
              --name "$ACR" --repository "$IMAGE_REPOSITORY" \
              --query "[?@=='$candidate_tag'] | length(@)" --output tsv)"
          fi
          az acr login --name "$ACR"
          if [[ "$existing_candidate_count" == "0" ]]; then
            docker tag "$IMAGE" "$candidate"
            docker push "$candidate"
          elif [[ "$existing_candidate_count" == "1" ]]; then
            echo "::notice::Reusing the already-published candidate only if its exact image identity agrees"
          else
            echo "::error::Unexpected duplicate candidate tags"
            exit 1
          fi
          digest="$(az acr repository show \
            --name "$ACR" --image "$IMAGE_REPOSITORY:$candidate_tag" \
            --query digest --output tsv)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$digest"
          docker pull "$image_ref"
          docker image inspect "$image_ref" --format '{{json .RepoDigests}}' |
            jq -e --arg ref "$image_ref" 'index($ref) != null' > /dev/null
          if [[ "$(docker image inspect "$image_ref" --format '{{.Id}}')" != "$SMOKE_TESTED_IMAGE_ID" ]]; then
            echo "::error::Published image differs from the smoke-tested image"
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "ref=$image_ref"
            echo "build_id=$BUILD_ID"
            echo "image_id=$SMOKE_TESTED_IMAGE_ID"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.publish_image_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy-shapepilot
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      IMAGE_REFERENCE: ${{ needs.publish.outputs.ref }}
      BUILD_ID: ${{ needs.publish.outputs.build_id }}
    steps:
      - name: Reserve post-mutation safety budget
        shell: bash
        run: echo "MUTATION_START_DEADLINE_EPOCH=$(( $(date +%s) + 900 ))" >> "$GITHUB_ENV"

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject a stale default-branch candidate after acquiring the deployment lock
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer default-branch commit superseded this candidate"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0

      - name: Validate immutable deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID" =~ $guid ]]
          [[ "$VITE_AZURE_CLIENT_ID" =~ $guid ]]
          [[ "$VITE_AZURE_CLIENT_ID" == "60b0b8cf-f1e2-4ba4-b89b-7d6dc3358251" ]]
          [[ "$LIVE_PATH" != "$READY_PATH" ]]
          [[ "$DEPLOYMENT_PROFILE" == "sqlite-one-worker" ]]
          [[ ! ("$INITIAL_DEPLOYMENT" == "true" && "$PUBLISH_IMAGE_ONLY" == "true") ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$IMAGE_REFERENCE" == "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$IMAGE_DIGEST" ]]
          [[ "$BUILD_ID" =~ ^$GITHUB_RUN_ID-[0-9]+$ ]]
          mkdir -p evidence

      - name: Azure login with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to the image registry
        shell: bash
        run: az acr login --name "$ACR"

      - name: Verify runtime settings and identity preconditions
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          identity="$(az webapp identity show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output json)"
          principal_id="$(jq -er \
            --arg tenant "$AZURE_TENANT_ID" \
            'select(.type == "SystemAssigned" and .tenantId == $tenant) |
             .principalId |
             select(test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"))' \
            <<<"$identity")"
          acr_scope="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.ContainerRegistry/registries/$ACR"
          pull_assignments="$(az role assignment list \
            --assignee-object-id "$principal_id" \
            --scope "$acr_scope" \
            --output json)"
          jq -e \
            --arg scope "$acr_scope" \
            --arg role "/subscriptions/$AZURE_SUBSCRIPTION_ID/providers/microsoft.authorization/roledefinitions/7f951dda-4ed3-4680-a7ca-43fe172d538d" \
            '[.[] | select(
              (.scope | ascii_downcase) == ($scope | ascii_downcase) and
              (.roleDefinitionId | ascii_downcase) == $role
            )] | length == 1' <<<"$pull_assignments" > /dev/null

          settings="$(az webapp config appsettings list \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output json)"
          jq -e \
            --arg client "$VITE_AZURE_CLIENT_ID" \
            --arg user_tenant "$VITE_AZURE_TENANT_ID" \
            '
              map({key: .name, value: .value}) | from_entries as $s |
              $s.NODE_ENV == "production" and
              $s.PORT == "3000" and
              $s.WEBSITES_PORT == "3000" and
              $s.WEBSITES_ENABLE_APP_SERVICE_STORAGE == "true" and
              $s.WEBSITES_CONTAINER_STOP_TIME_LIMIT == "60" and
              $s.DOCKER_REGISTRY_SERVER_URL ==
                "https://acrenzolopez01.azurecr.io" and
              $s.KEY_VAULT_URI == "https://kv-shapepilot-prod.vault.azure.net/" and
              $s.DB_PATH == "/home/data/shapepilot.db" and
              $s.SQLITE_JOURNAL_MODE == "DELETE" and
              $s.SHAPEPILOT_DB_BUSY_TIMEOUT_MS == "5000" and
              $s.SHAPEPILOT_DB_ALLOW_CREATE == "0" and
              $s.BACKUP_ROOT == "/home/data/backups/shapepilot" and
              $s.RECOVERY_WORK_ROOT == "/home/data/recovery/shapepilot" and
              $s.BACKUP_RETENTION_COUNT == "14" and
              $s.BACKUP_INTERVAL_HOURS == "24" and
              $s.AAD_TENANT_ID == $user_tenant and
              $s.SHAPEPILOT_ENTRA_TENANT_ID == $user_tenant and
              $s.SHAPEPILOT_API_AUDIENCE == ("api://" + $client) and
              $s.SHAPEPILOT_API_SCOPE == "access_as_user" and
              $s.VITE_AZURE_CLIENT_ID == $client and
              ($s | has("SHAPEPILOT_INITIALIZE_EMPTY_DB") | not) and
              $s.AZURE_OPENAI_API_KEY ==
                "@Microsoft.KeyVault(SecretUri=https://kv-shapepilot-prod.vault.azure.net/secrets/AZURE-OPENAI-API-KEY/)" and
              $s.AZURE_AI_FOUNDRY_ENDPOINT ==
                "https://aif-shapepilot-prod.openai.azure.com/openai/v1/" and
              $s.AZURE_AI_FOUNDRY_DEPLOYMENT == "shapepilot-designer"
            ' <<<"$settings" > /dev/null

      - name: Capture prior release and protected configuration
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' && env.INITIAL_DEPLOYMENT != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256_stream() { sha256sum | awk '{print $1}'; }
          app_settings_fingerprint() {
            az webapp config appsettings list \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS 'sort_by(.name) |
                map({name, value, slotSetting: (.slotSetting // false)})' |
              sha256_stream
          }
          site_invariant_fingerprint() {
            az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS '{
                identity: .identity,
                httpsOnly: .httpsOnly,
                publicNetworkAccess: .publicNetworkAccess,
                virtualNetworkSubnetId: .virtualNetworkSubnetId,
                outboundVnetRouting: .outboundVnetRouting,
                clientCertEnabled: .clientCertEnabled,
                siteConfig: {
                  acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                  alwaysOn: .siteConfig.alwaysOn,
                  healthCheckPath: .siteConfig.healthCheckPath,
                  http20Enabled: .siteConfig.http20Enabled,
                  numberOfWorkers: .siteConfig.numberOfWorkers,
                  vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                  ipSecurityRestrictions:
                    ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                  scmIpSecurityRestrictions:
                    ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                }
              }' |
              sha256_stream
          }

          config="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query '{
              alwaysOn:alwaysOn,
              acrManagedIdentity:acrUseManagedIdentityCreds,
              workers:numberOfWorkers,
              health:healthCheckPath,
              image:linuxFxVersion
            }' \
            --output json)"
          jq -e \
            --arg live "$LIVE_PATH" \
            '.alwaysOn == true and
             .workers == 1 and
             .acrManagedIdentity == true and
             .health == $live and
             (.image | startswith("DOCKER|"))' \
            <<<"$config" > /dev/null

          actual_acr_login_server="$(az acr show \
            --name "$ACR" \
            --query loginServer \
            --output tsv)"
          [[ "$actual_acr_login_server" == "$ACR_LOGIN_SERVER" ]]
          configured_ref="$(jq -r '.image' <<<"$config")"
          configured_ref="${configured_ref#DOCKER|}"
          expected_prefix="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY"
          case "$configured_ref" in
            "$expected_prefix"@sha256:*)
              previous_ref="$configured_ref"
              previous_digest="${configured_ref##*@}"
              ;;
            "$expected_prefix":*)
              previous_spec="${configured_ref#"$ACR_LOGIN_SERVER/"}"
              previous_digest="$(az acr repository show \
                --name "$ACR" \
                --image "$previous_spec" \
                --query digest \
                --output tsv)"
              previous_ref="$expected_prefix@$previous_digest"
              ;;
            *)
              echo "::error::Current image is outside the ShapePilot ACR repository"
              exit 1
              ;;
          esac
          [[ "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$previous_ref" =~ $image_pattern ]]

          previous_latest_digest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" \
            --query digest \
            --output tsv)"
          [[ "$previous_latest_digest" == "$previous_digest" ]]

          docker pull "$previous_ref"
          previous_sha="$(docker image inspect "$previous_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          previous_build_id="$(docker image inspect "$previous_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$previous_build_id" =~ ^[0-9]+-[0-9]+$ ]]

          app_settings_hash="$(app_settings_fingerprint)"
          site_invariants_hash="$(site_invariant_fingerprint)"
          echo "::add-mask::$app_settings_hash"
          echo "::add-mask::$site_invariants_hash"
          {
            echo "PREVIOUS_IMAGE_REFERENCE=$previous_ref"
            echo "PREVIOUS_IMAGE_DIGEST=$previous_digest"
            echo "PREVIOUS_LATEST_DIGEST=$previous_latest_digest"
            echo "PREVIOUS_HEALTH_SHA=$previous_sha"
            echo "PREVIOUS_BUILD_ID=$previous_build_id"
            echo "APP_SETTINGS_FINGERPRINT=$app_settings_hash"
            echo "SITE_INVARIANTS_FINGERPRINT=$site_invariants_hash"
            echo "DEPLOYMENT_MUTATED=false"
          } >> "$GITHUB_ENV"

      - name: Validate first-release baseline
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' && env.INITIAL_DEPLOYMENT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          config="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query '{
              alwaysOn:alwaysOn,
              acrManagedIdentity:acrUseManagedIdentityCreds,
              workers:numberOfWorkers,
              health:healthCheckPath,
              image:linuxFxVersion
            }' \
            --output json)"
          jq -e \
            --arg live "$LIVE_PATH" \
            '.alwaysOn == true and
             .acrManagedIdentity == true and
             .workers == 1 and
             .health == $live' \
            <<<"$config" > /dev/null

          actual_acr_login_server="$(az acr show \
            --name "$ACR" \
            --query loginServer \
            --output tsv)"
          [[ "$actual_acr_login_server" == "$ACR_LOGIN_SERVER" ]]
          configured_ref="$(jq -r '.image' <<<"$config")"
          configured_ref="${configured_ref#DOCKER|}"
          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$configured_ref" =~ $image_pattern ]]
          initial_digest="${configured_ref##*@}"
          published_digest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY@$initial_digest" \
            --query digest \
            --output tsv)"
          [[ "$published_digest" == "$initial_digest" ]]

          repository_exists="$(az acr repository list \
            --name "$ACR" \
            --query "contains(@, '$IMAGE_REPOSITORY')" \
            --output tsv)"
          latest_count=0
          if [[ "$repository_exists" == "true" ]]; then
            latest_count="$(az acr repository show-tags \
              --name "$ACR" \
              --repository "$IMAGE_REPOSITORY" \
              --query "[?@=='latest'] | length(@)" \
              --output tsv)"
          fi
          [[ "$latest_count" == "0" ]]

          live_status="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
            -o /dev/null \
            -w '%{http_code}' \
            "$PRODUCTION_URL$LIVE_PATH?initial-proof=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            2>/dev/null || true)"
          if [[ "$live_status" =~ ^2 ]]; then
            echo "::error::Initial deployment is forbidden for an already-live app"
            exit 1
          fi

          sha256_stream() { sha256sum | awk '{print $1}'; }
          app_settings_hash="$(
            az webapp config appsettings list \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS 'sort_by(.name) |
                map({name, value, slotSetting: (.slotSetting // false)})' |
              sha256_stream
          )"
          site_invariants_hash="$(
            az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS '{
                identity: .identity,
                httpsOnly: .httpsOnly,
                publicNetworkAccess: .publicNetworkAccess,
                virtualNetworkSubnetId: .virtualNetworkSubnetId,
                outboundVnetRouting: .outboundVnetRouting,
                clientCertEnabled: .clientCertEnabled,
                siteConfig: {
                  acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                  alwaysOn: .siteConfig.alwaysOn,
                  healthCheckPath: .siteConfig.healthCheckPath,
                  http20Enabled: .siteConfig.http20Enabled,
                  numberOfWorkers: .siteConfig.numberOfWorkers,
                  vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                  ipSecurityRestrictions:
                    ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                  scmIpSecurityRestrictions:
                    ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                }
              }' |
              sha256_stream
          )"
          echo "::add-mask::$app_settings_hash"
          echo "::add-mask::$site_invariants_hash"
          {
            echo "PREVIOUS_IMAGE_REFERENCE="
            echo "PREVIOUS_IMAGE_DIGEST="
            echo "PREVIOUS_LATEST_DIGEST="
            echo "PREVIOUS_HEALTH_SHA="
            echo "PREVIOUS_BUILD_ID="
            echo "INITIAL_IMAGE_REFERENCE=$configured_ref"
            echo "APP_SETTINGS_FINGERPRINT=$app_settings_hash"
            echo "SITE_INVARIANTS_FINGERPRINT=$site_invariants_hash"
            echo "DEPLOYMENT_MUTATED=false"
          } >> "$GITHUB_ENV"

      - name: Verify immutable ShapePilot image before activation
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="$GITHUB_SHA-$BUILD_ID"
          published_digest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:$candidate_tag" \
            --query digest \
            --output tsv)"
          [[ "$published_digest" == "$IMAGE_DIGEST" ]]
          [[ "$IMAGE_REFERENCE" == "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$IMAGE_DIGEST" ]]
          docker pull "$IMAGE_REFERENCE"
          [[ "$(docker image inspect "$IMAGE_REFERENCE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          [[ "$(docker image inspect "$IMAGE_REFERENCE" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" == "$BUILD_ID" ]]

      - name: Preload rollback image before production mutation
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INITIAL_DEPLOYMENT" == "true" ]]; then
            docker pull "$INITIAL_IMAGE_REFERENCE"
          else
            docker tag \
              "$PREVIOUS_IMAGE_REFERENCE" \
              "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          fi

      - name: Arm rollback before production mutation
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer default-branch commit superseded this candidate before mutation"
            exit 1
          fi
          if [[ "$(date +%s)" -ge "$MUTATION_START_DEADLINE_EPOCH" ]]; then
            echo "::error::Preflight exhausted the reserved candidate and rollback time"
            exit 1
          fi
          echo "DEPLOYMENT_MUTATED=true" >> "$GITHUB_ENV"

      - name: Activate and confirm the inspected digest within ten minutes
        id: candidate
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 595s bash <<'CANDIDATE'
          set -euo pipefail
          stop_sqlite_app() {
            az webapp stop \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output none
            absent_rounds=0
            for _attempt in $(seq 1 60); do
              state="$(az webapp show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query state \
                --output tsv)"
              status="$(curl -sS --max-time 3 \
                -o /dev/null \
                -w '%{http_code}' \
                "$PRODUCTION_URL$LIVE_PATH?stop-proof=$GITHUB_RUN_ID-$_attempt" \
                2>/dev/null || true)"
              if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
                absent_rounds=$((absent_rounds + 1))
                [[ "$absent_rounds" -ge 3 ]] && return
              else
                absent_rounds=0
              fi
              sleep 2
            done
            echo "::error::Old SQLite process did not become observably absent"
            return 1
          }

          stop_sqlite_app
          az webapp config container set \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --container-image-name "$IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --output none
          configured="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query linuxFxVersion \
            --output tsv)"
          [[ "$configured" == "DOCKER|$IMAGE_REFERENCE" ]]
          az webapp start \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output none

          # Stop proof excludes a prior writer; release checks pin the producing build.
          verify_args=(
            --base-url "$PRODUCTION_URL"
            --live-path "$LIVE_PATH"
            --ready-path "$READY_PATH"
            --profile "$DEPLOYMENT_PROFILE"
            --expected-sha "$GITHUB_SHA"
            --expected-build-id "$BUILD_ID"
            --attempts "$MAX_ATTEMPTS"
            --confirmations "$REQUIRED_CONFIRMATIONS"
            --interval-ms "$((POLL_INTERVAL_SECONDS * 1000))"
            --request-timeout-ms "$((HTTP_TIMEOUT_SECONDS * 1000))"
            --run-token "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          )
          node scripts/verify-deployment.mjs "${verify_args[@]}"

          sha256_stream() { sha256sum | awk '{print $1}'; }
          settings_after="$(
            az webapp config appsettings list \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS 'sort_by(.name) |
                map({name, value, slotSetting: (.slotSetting // false)})' |
              sha256_stream
          )"
          site_after="$(
            az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS '{
                identity: .identity,
                httpsOnly: .httpsOnly,
                publicNetworkAccess: .publicNetworkAccess,
                virtualNetworkSubnetId: .virtualNetworkSubnetId,
                outboundVnetRouting: .outboundVnetRouting,
                clientCertEnabled: .clientCertEnabled,
                siteConfig: {
                  acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                  alwaysOn: .siteConfig.alwaysOn,
                  healthCheckPath: .siteConfig.healthCheckPath,
                  http20Enabled: .siteConfig.http20Enabled,
                  numberOfWorkers: .siteConfig.numberOfWorkers,
                  vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                  ipSecurityRestrictions:
                    ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                  scmIpSecurityRestrictions:
                    ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                }
              }' |
              sha256_stream
          )"
          if [[ "$settings_after" != "$APP_SETTINGS_FINGERPRINT" ||
                "$site_after" != "$SITE_INVARIANTS_FINGERPRINT" ]]; then
            echo "::error::Protected production configuration changed during activation"
            exit 1
          fi
          configured="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query linuxFxVersion \
            --output tsv)"
          [[ "$configured" == "DOCKER|$IMAGE_REFERENCE" ]]

          latest_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          docker tag "$IMAGE_REFERENCE" "$latest_ref"
          docker push "$latest_ref"
          promoted="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" \
            --query digest \
            --output tsv)"
          [[ "$promoted" == "$IMAGE_DIGEST" ]]

          node scripts/verify-deployment.mjs \
            --base-url "$PRODUCTION_URL" \
            --live-path "$LIVE_PATH" \
            --ready-path "$READY_PATH" \
            --profile "$DEPLOYMENT_PROFILE" \
            --expected-sha "$GITHUB_SHA" \
            --expected-build-id "$BUILD_ID" \
            --attempts 12 \
            --confirmations "$REQUIRED_CONFIRMATIONS" \
            --interval-ms "$((POLL_INTERVAL_SECONDS * 1000))" \
            --request-timeout-ms "$((HTTP_TIMEOUT_SECONDS * 1000))" \
            --run-token "promoted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          jq -n \
            --arg contract "$DEPLOYMENT_CONTRACT_VERSION" \
            --arg profile "$DEPLOYMENT_PROFILE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg buildId "$BUILD_ID" \
            --arg image "$IMAGE_REFERENCE" \
            --arg previous "${PREVIOUS_IMAGE_REFERENCE:-}" \
            --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{
              contract: $contract,
              profile: $profile,
              repository: $repository,
              sha: $sha,
              buildId: $buildId,
              image: $image,
              previousImage: $previous,
              workflowRun: $run,
              confirmations: 3,
              settingsUnchanged: true,
              siteInvariantsUnchanged: true,
              rollbackPerformed: false
            }' > evidence/deployment.json
          CANDIDATE

      - name: Select cancellation-safe rollback budget
        if: ${{ cancelled() }}
        run: echo "ROLLBACK_CANCELLED=true" >> "$GITHUB_ENV"

      - name: Restore prior release after failure or cancellation
        if: ${{ always() && env.PUBLISH_IMAGE_ONLY != 'true' && (failure() || cancelled()) && env.DEPLOYMENT_MUTATED == 'true' && env.INITIAL_DEPLOYMENT != 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 235s bash <<'ROLLBACK'
          set -euo pipefail
          mkdir -p evidence
          echo "::warning::Restoring prior immutable release"
          stop_attempts=60
          stop_sleep_seconds=2
          verify_attempts="$ROLLBACK_MAX_ATTEMPTS"
          verify_interval_ms=3000
          verify_timeout_ms=4000
          stop_sqlite_app() {
            az webapp stop \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output none
            absent_rounds=0
            for _attempt in $(seq 1 "$stop_attempts"); do
              state="$(az webapp show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query state \
                --output tsv)"
              status="$(curl -sS --max-time 3 \
                -o /dev/null \
                -w '%{http_code}' \
                "$PRODUCTION_URL$LIVE_PATH?rollback-stop-proof=$GITHUB_RUN_ID-$_attempt" \
                2>/dev/null || true)"
              if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
                absent_rounds=$((absent_rounds + 1))
                [[ "$absent_rounds" -ge 3 ]] && return
              else
                absent_rounds=0
              fi
              sleep "$stop_sleep_seconds"
            done
            echo "::error::Candidate SQLite process did not become observably absent"
            return 1
          }

          stop_sqlite_app
          az webapp config container set \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --container-image-name "$PREVIOUS_IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --output none
          az webapp start \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output none

          previous_latest_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$PREVIOUS_LATEST_DIGEST"
          latest_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$previous_latest_ref" =~ $image_pattern ]]
          docker tag "$previous_latest_ref" "$latest_ref"
          docker push "$latest_ref"
          configured="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query linuxFxVersion \
            --output tsv)"
          restored_latest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" \
            --query digest \
            --output tsv)"
          [[ "$configured" == "DOCKER|$PREVIOUS_IMAGE_REFERENCE" ]]
          [[ "$restored_latest" == "$PREVIOUS_LATEST_DIGEST" ]]

          node scripts/verify-deployment.mjs \
            --base-url "$PRODUCTION_URL" \
            --live-path "$LIVE_PATH" \
            --ready-path "$READY_PATH" \
            --profile "$DEPLOYMENT_PROFILE" \
            --expected-sha "$PREVIOUS_HEALTH_SHA" \
            --expected-build-id "$PREVIOUS_BUILD_ID" \
            --attempts "$verify_attempts" \
            --confirmations "$REQUIRED_CONFIRMATIONS" \
            --interval-ms "$verify_interval_ms" \
            --request-timeout-ms "$verify_timeout_ms" \
            --run-token "rollback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          sha256_stream() { sha256sum | awk '{print $1}'; }
          settings_after="$(
            az webapp config appsettings list \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS 'sort_by(.name) |
                map({name, value, slotSetting: (.slotSetting // false)})' |
              sha256_stream
          )"
          site_after="$(
            az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS '{
                identity: .identity,
                httpsOnly: .httpsOnly,
                publicNetworkAccess: .publicNetworkAccess,
                virtualNetworkSubnetId: .virtualNetworkSubnetId,
                outboundVnetRouting: .outboundVnetRouting,
                clientCertEnabled: .clientCertEnabled,
                siteConfig: {
                  acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                  alwaysOn: .siteConfig.alwaysOn,
                  healthCheckPath: .siteConfig.healthCheckPath,
                  http20Enabled: .siteConfig.http20Enabled,
                  numberOfWorkers: .siteConfig.numberOfWorkers,
                  vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                  ipSecurityRestrictions:
                    ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                  scmIpSecurityRestrictions:
                    ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                }
              }' |
              sha256_stream
          )"
          if [[ "$settings_after" != "$APP_SETTINGS_FINGERPRINT" ||
                "$site_after" != "$SITE_INVARIANTS_FINGERPRINT" ]]; then
            echo "::error::Protected production configuration changed during rollback"
            exit 1
          fi
          jq -n \
            --arg image "$PREVIOUS_IMAGE_REFERENCE" \
            --arg sha "$PREVIOUS_HEALTH_SHA" \
            --arg buildId "$PREVIOUS_BUILD_ID" \
            --arg cancelled "$ROLLBACK_CANCELLED" \
            '{
              rollbackPerformed: true,
              restoredImage: $image,
              restoredSha: $sha,
              restoredBuildId: $buildId,
              confirmations: 3,
              settingsUnchanged: true,
              siteInvariantsUnchanged: true,
              cancellationBudget: ($cancelled == "true")
            }' > evidence/rollback.json
          ROLLBACK

      - name: Stop failed first-release candidate
        if: ${{ always() && env.PUBLISH_IMAGE_ONLY != 'true' && (failure() || cancelled()) && env.DEPLOYMENT_MUTATED == 'true' && env.INITIAL_DEPLOYMENT == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 235s bash <<'INITIAL_ROLLBACK'
          set -euo pipefail
          mkdir -p evidence
          stop_attempts=60
          stop_sleep_seconds=2
          stop_sqlite_app() {
            az webapp stop \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output none
            absent_rounds=0
            for _attempt in $(seq 1 "$stop_attempts"); do
              state="$(az webapp show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query state \
                --output tsv)"
              status="$(curl -sS --max-time 3 \
                -o /dev/null \
                -w '%{http_code}' \
                "$PRODUCTION_URL$LIVE_PATH?failed-initial-stop-proof=$GITHUB_RUN_ID-$_attempt" \
                2>/dev/null || true)"
              if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
                absent_rounds=$((absent_rounds + 1))
                [[ "$absent_rounds" -ge 3 ]] && return
              else
                absent_rounds=0
              fi
              sleep "$stop_sleep_seconds"
            done
            echo "::error::Failed initial SQLite process did not become observably absent"
            return 1
          }

          stop_sqlite_app

          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$INITIAL_IMAGE_REFERENCE" =~ $image_pattern ]]
          az webapp config container set \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --container-image-name "$INITIAL_IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --output none

          repository_exists="$(az acr repository list \
            --name "$ACR" \
            --query "contains(@, '$IMAGE_REPOSITORY')" \
            --output tsv)"
          latest_count=0
          if [[ "$repository_exists" == "true" ]]; then
            latest_count="$(az acr repository show-tags \
              --name "$ACR" \
              --repository "$IMAGE_REPOSITORY" \
              --query "[?@=='latest'] | length(@)" \
              --output tsv)"
          fi
          if [[ "$latest_count" == "1" ]]; then
            failed_latest="$(az acr repository show \
              --name "$ACR" \
              --image "$IMAGE_REPOSITORY:latest" \
              --query digest \
              --output tsv)"
            [[ "$failed_latest" == "$IMAGE_DIGEST" ]]
            az acr repository untag \
              --name "$ACR" \
              --image "$IMAGE_REPOSITORY:latest"
          elif [[ "$latest_count" != "0" ]]; then
            echo "::error::Unexpected duplicate latest tags"
            exit 1
          fi

          az webapp stop \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output none

          for _attempt in $(seq 1 "$stop_attempts"); do
            state="$(az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --query state \
              --output tsv)"
            status="$(curl -sS --max-time 3 \
              -o /dev/null \
              -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?failed-initial-proof=$GITHUB_RUN_ID-$_attempt" \
              2>/dev/null || true)"
            if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
              configured="$(az webapp config show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query linuxFxVersion \
                --output tsv)"
              [[ "$configured" == "DOCKER|$INITIAL_IMAGE_REFERENCE" ]]
              if [[ "$repository_exists" == "true" ]]; then
                remaining_latest="$(az acr repository show-tags \
                  --name "$ACR" \
                  --repository "$IMAGE_REPOSITORY" \
                  --query "[?@=='latest'] | length(@)" \
                  --output tsv)"
                [[ "$remaining_latest" == "0" ]]
              fi
              jq -n \
                --arg image "$IMAGE_REFERENCE" \
                --arg cancelled "$ROLLBACK_CANCELLED" \
                '{
                  initialDeploymentFailed: true,
                  failedImage: $image,
                  appStopped: true,
                  priorReleaseAvailable: false,
                  initialRetryReady: true,
                  cancellationBudget: ($cancelled == "true")
                }' > evidence/rollback.json
              exit 0
            fi
            sleep "$stop_sleep_seconds"
          done
          echo "::error::Failed initial candidate did not stop"
          exit 1
          INITIAL_ROLLBACK

      - name: Upload nonsecret deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

  diagnostics_candidate:
    needs: publish
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REFERENCE: ${{ needs.publish.outputs.ref }}
      SMOKE_TESTED_IMAGE_ID: ${{ needs.publish.outputs.image_id }}
      DIAGNOSTIC_CANDIDATE_DIGEST: ${{ needs.publish.outputs.digest }}
      DIAGNOSTIC_BUILD_ID: ${{ needs.publish.outputs.build_id }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0

      - name: Retain immutable publication evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          [[ "$DIAGNOSTIC_CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SMOKE_TESTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --arg contract "$DEPLOYMENT_CONTRACT_VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg buildId "$DIAGNOSTIC_BUILD_ID" \
            --arg image "$IMAGE_REFERENCE" \
            --arg imageId "$SMOKE_TESTED_IMAGE_ID" \
            --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --argjson imageOnly "$PUBLISH_IMAGE_ONLY" \
            '{
              contract: $contract, repository: $repository, sha: $sha,
              buildId: $buildId, image: $image, smokeTestedImageId: $imageId,
              workflowRun: $run, imageOnly: $imageOnly, immutableDigestVerified: true
            }' > reports/image-publication.json

      - name: Azure login for read-only diagnostics
        if: ${{ always() }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate and pull the exact published candidate for diagnostics
        id: diagnostic-image
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          if [[ ! "$DIAGNOSTIC_CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ||
                "$IMAGE_REFERENCE" != "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$DIAGNOSTIC_CANDIDATE_DIGEST" ]]; then
            echo "::error::No exact published image is available for candidate diagnostics"
            exit 1
          fi
          az acr login --name "$ACR"
          docker pull "$IMAGE_REFERENCE"

      - name: Generate exact-image SBOM
        id: image-sbom
        if: ${{ always() && steps.diagnostic-image.outcome == 'success' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_REFERENCE }}
          format: spdx-json
          output-file: reports/image-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record exact-image SBOM outcome
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: image-sbom
          category: sbom
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image-sbom.outcome == 'success' && '0' || '' }}
          execution-error: ${{ steps.image-sbom.outcome != 'success' && format('Exact-image SBOM action outcome was {0}; no process exit code was reported.', steps.image-sbom.outcome) || '' }}
          report: reports/image-sbom.spdx.json
          report-format: spdx-json

      - name: Prove migration compatibility and local snapshot safety in the exact image
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: migration-compatibility-precheck
          category: migration-precondition
          phase: pre-activation
          report: reports/migration-check.json
          report-format: generic-json
          run: |
            set -euo pipefail
            mkdir -p reports
            migration_args=(--profile "$DEPLOYMENT_PROFILE")
            if [[ "$INITIAL_DEPLOYMENT" == "true" ]]; then
              migration_args+=(--initial)
            fi
            [[ "$DIAGNOSTIC_CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$IMAGE_REFERENCE" == "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$DIAGNOSTIC_CANDIDATE_DIGEST" ]]
            docker run --rm "$IMAGE_REFERENCE" \
              node scripts/check-deploy-migration.ts "${migration_args[@]}" \
              > reports/migration-check.json

      - name: Observe the shared ACR contract
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: shared-acr-precheck
          category: protected-configuration-precheck
          phase: pre-activation
          report: reports/acr-check.json
          report-format: generic-json
          run: |
            set -euo pipefail
            mkdir -p reports
            npm run --silent deploy:acr-check -- \
              --registry "$ACR" \
              --login-server "$ACR_LOGIN_SERVER" \
              --resource-group "$RG" \
              --subscription-id "$AZURE_SUBSCRIPTION_ID" \
              --repository "$IMAGE_REPOSITORY" \
              > reports/acr-check.json

      - name: Observe deployment identity role assignments
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: deployment-rbac-precheck
          category: protected-configuration-precheck
          phase: pre-activation
          report: reports/rbac-check.json
          report-format: generic-json
          run: |
            set -euo pipefail
            mkdir -p reports
            rbac_args=(
              --client-id "$AZURE_CLIENT_ID"
              --tenant-id "$AZURE_TENANT_ID"
              --subscription-id "$AZURE_SUBSCRIPTION_ID"
              --resource-group "$RG"
              --registry "$ACR"
              --web-app "$WEBAPP"
            )
            if [[ "$PUBLISH_IMAGE_ONLY" != "true" ]]; then
              rbac_args+=(--require-web-app-role)
            fi
            npm run --silent deploy:rbac-check -- "${rbac_args[@]}" > reports/rbac-check.json

      - name: Observe the existing owned-monitor invariant
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: monitoring-precheck
          category: monitoring-precheck
          phase: pre-activation
          report: reports/monitor-check.json
          report-format: generic-json
          run: |
            set -euo pipefail
            mkdir -p reports
            monitor_phase=predeploy
            if [[ "$PUBLISH_IMAGE_ONLY" == "true" ]]; then
              monitor_phase=image-publication
            elif [[ "$INITIAL_DEPLOYMENT" == "true" ]]; then
              monitor_phase=initial-predeploy
            fi
            npm run --silent deploy:monitor-check -- \
              --phase "$monitor_phase" \
              --resource-group "$RG" \
              --webapp "$WEBAPP" \
              --base-url "$PRODUCTION_URL" \
              > reports/monitor-check.json

      - name: Summarize candidate diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-activation
          mode: aggregate

      - name: Upload candidate diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-diagnostics/
            reports/
          if-no-files-found: error
          retention-days: 30
