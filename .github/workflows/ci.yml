name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      initial_deployment:
        description: 'First activation only: no prior live release or traffic exists'
        required: false
        default: false
        type: boolean
      publish_image_only:
        description: 'Publish a signed immutable image without requiring or changing the Web App'
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-shapepilot' || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

env:
  DEPLOYMENT_CONTRACT_VERSION: p1-11-v1
  DEPLOYMENT_PROFILE: sqlite-one-worker
  INITIAL_DEPLOYMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.initial_deployment && 'true' || 'false' }}
  PUBLISH_IMAGE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image_only && 'true' || 'false' }}
  RG: rg-personal-apps-prod
  ACR: acrenzolopez01
  ACR_LOGIN_SERVER: acrenzolopez01.azurecr.io
  IMAGE_REPOSITORY: shapepilot
  WEBAPP: app-shapepilot-prod-lwxhu7jxlrbtu
  PRODUCTION_URL: https://app-shapepilot-prod-lwxhu7jxlrbtu.azurewebsites.net
  LIVE_PATH: /api/live
  READY_PATH: /api/ready
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: de625678-c55b-4494-9558-14946cbb6133
  AZURE_SUBSCRIPTION_ID: 1cf02211-8d77-4658-bb6a-0f83ec831c3b
  VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
  VITE_AZURE_TENANT_ID: 52188f12-db6b-46c6-88ff-08c802f0ed3b
  REQUIRED_CONFIRMATIONS: '3'
  MAX_ATTEMPTS: '120'
  ROLLBACK_MAX_ATTEMPTS: '120'
  POLL_INTERVAL_SECONDS: '5'
  HTTP_TIMEOUT_SECONDS: '8'
  ROLLBACK_CANCELLED: 'false'
  DIAGNOSTIC_RECORDS: deployment-diagnostics/records.jsonl

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install with lifecycle scripts
        run: npm ci --no-audit --no-fund

      - name: Diagnostic - audit full dependency tree
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-dependency-audit
          category: source-audit
          phase: pre-build
          report: reports/npm-audit-full.json
          report-format: npm-audit-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '300000'
          run: |
            set -euo pipefail
            mkdir -p reports
            rm -f reports/npm-audit-full.json
            npm audit --audit-level=high --json > reports/npm-audit-full.json

      - name: Diagnostic - audit production dependency tree
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-dependency-audit
          category: source-audit
          phase: pre-build
          report: reports/npm-audit-production.json
          report-format: npm-audit-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '300000'
          run: |
            set -euo pipefail
            mkdir -p reports
            rm -f reports/npm-audit-production.json
            npm audit --omit=dev --audit-level=high --json \
              > reports/npm-audit-production.json

      - name: Diagnostic - generate source SBOM for CI
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-sbom
          category: sbom
          phase: pre-build
          report: reports/source-sbom.cdx.json
          report-format: cyclonedx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '300000'
          run: |
            set -euo pipefail
            mkdir -p reports
            rm -f reports/source-sbom.cdx.json
            npm sbom --sbom-format=cyclonedx > reports/source-sbom.cdx.json
            jq -e 'type == "object" and .bomFormat == "CycloneDX"' \
              reports/source-sbom.cdx.json > /dev/null

      - name: Run strict source gates
        run: npm run ci

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(sqlite|sqlite3|db)(-|$)|-(journal|wal|shm)$|(^|/)(dist|coverage|native/build|\.recovery-work|artifacts?)(/|$)'; then
            echo "::error::Tracked runtime artifact detected"
            exit 1
          fi

      - name: Aggregate quality deployment diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-build
          mode: aggregate
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Upload quality deployment diagnostic evidence
        id: upload-quality-diagnostics
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-diagnostics-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-diagnostics/
            reports/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

      - name: Warn if quality diagnostic evidence upload failed
        if: ${{ always() && steps.upload-quality-diagnostics.outcome == 'failure' }}
        run: >-
          echo "::warning title=Deployment diagnostics upload::The best-effort quality
          diagnostic evidence upload failed; findings remain visible in warnings
          and the job summary."

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: shapepilot-ci:${{ github.sha }}
      CONTAINER: shapepilot-ci-${{ github.run_id }}-${{ github.run_attempt }}
      VOLUME: shapepilot-ci-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_NUMBER: ${{ github.run_number }}
      TEST_TENANT_ID: 52188f12-db6b-46c6-88ff-08c802f0ed3b
      TEST_CLIENT_ID: 11112222-3333-4444-5555-666677778888
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned Linux image
        shell: bash
        run: |
          set -euo pipefail
          commit_timestamp="$(
            git show -s --format=%cI "$GITHUB_SHA" |
              xargs -I{} node -e 'console.log(new Date(process.argv[1]).toISOString())' '{}'
          )"
          docker build --pull \
            --build-arg "BUILD_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_ID=$BUILD_ID" \
            --build-arg "BUILD_NUMBER=$BUILD_NUMBER" \
            --build-arg "BUILD_TIMESTAMP=$commit_timestamp" \
            --build-arg "VITE_AZURE_CLIENT_ID=$TEST_CLIENT_ID" \
            --build-arg "VITE_AZURE_TENANT_ID=$TEST_TENANT_ID" \
            --build-arg "VITE_API_SCOPE=api://$TEST_CLIENT_ID/access_as_user" \
            --tag "$IMAGE" \
            .

          [[ "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" == "node" ]]
          docker image inspect "$IMAGE" --format '{{json .Config.Volumes}}' |
            jq -e '[((. // {}) | keys[]) |
              select(. == "/home" or startswith("/home/"))] | length == 0'
          [[ "$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            == "$GITHUB_SHA" ]]
          [[ "$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" \
            == "$BUILD_ID" ]]

      - name: Smoke native SQLite and production endpoints
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$VOLUME" > /dev/null

          common_env=(
            --env "AAD_TENANT_ID=$TEST_TENANT_ID"
            --env "SHAPEPILOT_ENTRA_TENANT_ID=$TEST_TENANT_ID"
            --env "SHAPEPILOT_API_AUDIENCE=api://$TEST_CLIENT_ID"
            --env "SHAPEPILOT_API_SCOPE=access_as_user"
          )
          docker run --rm \
            --user 0 \
            --mount "type=volume,source=$VOLUME,target=/home/data" \
            "$IMAGE" \
            chown node:node /home/data

          docker run --detach \
            --name "$CONTAINER" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=volume,source=$VOLUME,target=/home/data" \
            "${common_env[@]}" \
            --env SHAPEPILOT_INITIALIZE_EMPTY_DB=1 \
            "$IMAGE" > /dev/null

          docker exec "$CONTAINER" node scripts/verify-deployment.mjs \
            --base-url http://127.0.0.1:3000 \
            --live-path /api/live \
            --ready-path /api/ready \
            --profile sqlite-one-worker \
            --expected-sha "$GITHUB_SHA" \
            --expected-build-id "$BUILD_ID" \
            --attempts 30 \
            --confirmations 3 \
            --interval-ms 1000 \
            --request-timeout-ms 3000 \
            --run-token "ci-$BUILD_ID"

          docker exec "$CONTAINER" node --input-type=module -e "
            import { existsSync, readFileSync, statSync } from 'node:fs';
            import Database from 'better-sqlite3';
            import { EMPTY_SEED_DOMAIN_TABLES } from './server/emptySeed.ts';
            const markerPath = '/home/data/.shapepilot-empty-seed.json';
            for (const path of [process.env.DB_PATH, markerPath]) {
              const stat = statSync(path);
              if (stat.uid !== 1000 || stat.gid !== 1000 || (stat.mode & 0o777) !== 0o600) {
                throw new Error('bootstrap authority ownership or mode is invalid');
              }
            }
            const marker = JSON.parse(readFileSync(markerPath, 'utf8'));
            if (marker.sourceSha !== '$GITHUB_SHA' || marker.buildId !== '$BUILD_ID') {
              throw new Error('bootstrap marker build identity is invalid');
            }
            const db = new Database(process.env.DB_PATH, {
              readonly: true,
              fileMustExist: true,
            });
            db.pragma('query_only = ON');
            if (String(db.pragma('journal_mode', { simple: true })).toLowerCase() !== 'delete') {
              throw new Error('journal mode is not DELETE');
            }
            if (db.pragma('foreign_keys', { simple: true }) !== 1) {
              throw new Error('foreign keys are not enabled');
            }
            if (existsSync(process.env.DB_PATH + '-wal') || existsSync(process.env.DB_PATH + '-shm')) {
              throw new Error('WAL sidecars exist');
            }
            for (const table of EMPTY_SEED_DOMAIN_TABLES) {
              if (db.prepare('SELECT COUNT(*) AS count FROM ' + table).get().count !== 0) {
                throw new Error('bootstrap inserted a domain row into ' + table);
              }
            }
            db.close();
          "

          docker rm --force "$CONTAINER" > /dev/null
          docker run --detach \
            --name "$CONTAINER" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=volume,source=$VOLUME,target=/home/data" \
            "${common_env[@]}" \
            "$IMAGE" > /dev/null
          docker exec "$CONTAINER" node scripts/verify-deployment.mjs \
            --base-url http://127.0.0.1:3000 \
            --live-path /api/live \
            --ready-path /api/ready \
            --profile sqlite-one-worker \
            --expected-sha "$GITHUB_SHA" \
            --expected-build-id "$BUILD_ID" \
            --attempts 30 \
            --confirmations 3 \
            --interval-ms 1000 \
            --request-timeout-ms 3000 \
            --run-token "ci-restart-$BUILD_ID"

  deploy:
    needs: container
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # The workflow run number that preceded build 1, so the release counter
      # shown in the app reads 4 on the run after ShapePilot 2.5.3 was cut.
      BUILD_NUMBER_BASELINE: 37
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reserve post-mutation safety budget
        shell: bash
        run: echo "MUTATION_START_DEADLINE_EPOCH=$(( $(date +%s) + 5400 ))" >> "$GITHUB_ENV"

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Validate immutable deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID" =~ $guid ]]
          [[ "$VITE_AZURE_CLIENT_ID" =~ $guid ]]
          [[ "$VITE_AZURE_CLIENT_ID" == "60b0b8cf-f1e2-4ba4-b89b-7d6dc3358251" ]]
          [[ "$LIVE_PATH" != "$READY_PATH" ]]
          [[ "$DEPLOYMENT_PROFILE" == "sqlite-one-worker" ]]
          [[ ! ("$INITIAL_DEPLOYMENT" == "true" && "$PUBLISH_IMAGE_ONLY" == "true") ]]

      - name: Install exact deployment dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence reports
          npm ci --no-audit --no-fund

      - name: Diagnostic - deployment source SBOM
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-sbom
          category: sbom
          phase: pre-build
          report: reports/deployment-source-sbom.cdx.json
          report-format: cyclonedx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '300000'
          run: |
            set -euo pipefail
            mkdir -p reports
            rm -f reports/deployment-source-sbom.cdx.json
            npm sbom --sbom-format=cyclonedx \
              > reports/deployment-source-sbom.cdx.json
            jq -e 'type == "object" and .bomFormat == "CycloneDX"' \
              reports/deployment-source-sbom.cdx.json > /dev/null

      - name: Diagnostic - migration compatibility
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: migration-compatibility-precheck
          category: migration-precondition
          phase: pre-activation
          report: reports/migration-compatibility.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '300000'
          run: |
            npm run --silent deploy:precheck -- migration \
              --profile "$DEPLOYMENT_PROFILE" \
              --initial "$INITIAL_DEPLOYMENT" \
              --report reports/migration-compatibility.json

      - name: Run blocking deployment validation
        run: npm run ci:deploy

      - name: Azure login with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify shared ACR and deployment RBAC
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent deploy:acr-check -- \
            --registry "$ACR" \
            --login-server "$ACR_LOGIN_SERVER" \
            --resource-group "$RG" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --repository "$IMAGE_REPOSITORY" \
            > /dev/null

          rbac_args=(
            --client-id "$AZURE_CLIENT_ID"
            --tenant-id "$AZURE_TENANT_ID"
            --subscription-id "$AZURE_SUBSCRIPTION_ID"
            --resource-group "$RG"
            --registry "$ACR"
            --web-app "$WEBAPP"
          )
          if [[ "$PUBLISH_IMAGE_ONLY" != "true" ]]; then
            rbac_args+=(--require-web-app-role)
          fi
          npm run deploy:rbac-check -- "${rbac_args[@]}"

      - name: Diagnostic - monitoring resource precheck
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: monitoring-precheck
          category: monitoring-precheck
          phase: pre-activation
          report: reports/monitoring-precheck.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '120000'
          run: |
            monitor_phase=predeploy
            if [[ "$PUBLISH_IMAGE_ONLY" == "true" ]]; then
              monitor_phase=image-publication
            elif [[ "$INITIAL_DEPLOYMENT" == "true" ]]; then
              monitor_phase=initial-predeploy
            fi
            npm run --silent deploy:precheck -- monitoring \
              --phase "$monitor_phase" \
              --resource-group "$RG" \
              --webapp "$WEBAPP" \
              --base-url "$PRODUCTION_URL" \
              --report reports/monitoring-precheck.json

      - name: Verify runtime deployment identity
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          identity="$(az webapp identity show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output json)"
          principal_id="$(jq -er \
            --arg tenant "$AZURE_TENANT_ID" \
            'select(.type == "SystemAssigned" and .tenantId == $tenant) |
             .principalId |
             select(test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"))' \
            <<<"$identity")"
          acr_scope="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.ContainerRegistry/registries/$ACR"
          pull_assignments="$(az role assignment list \
            --assignee-object-id "$principal_id" \
            --scope "$acr_scope" \
            --output json)"
          jq -e \
            --arg scope "$acr_scope" \
            --arg role "/subscriptions/$AZURE_SUBSCRIPTION_ID/providers/microsoft.authorization/roledefinitions/7f951dda-4ed3-4680-a7ca-43fe172d538d" \
            '[.[] | select(
              (.scope | ascii_downcase) == ($scope | ascii_downcase) and
              (.roleDefinitionId | ascii_downcase) == $role
            )] | length == 1' <<<"$pull_assignments" > /dev/null

      - name: Diagnostic - protected runtime configuration
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: protected-configuration-precheck
          category: protected-configuration-precheck
          phase: pre-activation
          report: reports/protected-configuration.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '120000'
          run: |
            npm run --silent deploy:precheck -- protected-configuration \
              --resource-group "$RG" \
              --webapp "$WEBAPP" \
              --report reports/protected-configuration.json

      - name: Diagnostic - skip protected configuration without Web App
        if: ${{ env.PUBLISH_IMAGE_ONLY == 'true' }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: protected-configuration-precheck
          category: protected-configuration-precheck
          phase: pre-activation
          mode: skip
          reason: Image-only publication does not require a Web App prerequisite.
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Warn that protected configuration diagnostic was skipped
        if: ${{ env.PUBLISH_IMAGE_ONLY == 'true' }}
        run: >-
          echo "::warning title=Deployment diagnostic skipped - protected-configuration-precheck::The
          image-only path has no Web App prerequisite; the skip is recorded and does
          not block image publication."

      - name: Capture prior release and rollback baselines
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' && env.INITIAL_DEPLOYMENT != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256_stream() { sha256sum | awk '{print $1}'; }
          app_settings_snapshot_hash() {
            az webapp config appsettings list \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS 'sort_by(.name) |
                map({name, value, slotSetting: (.slotSetting // false)})' |
              sha256_stream
          }
          site_snapshot_hash() {
            az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS '{
                identity: .identity,
                httpsOnly: .httpsOnly,
                publicNetworkAccess: .publicNetworkAccess,
                virtualNetworkSubnetId: .virtualNetworkSubnetId,
                outboundVnetRouting: .outboundVnetRouting,
                clientCertEnabled: .clientCertEnabled,
                siteConfig: {
                  acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                  alwaysOn: .siteConfig.alwaysOn,
                  healthCheckPath: .siteConfig.healthCheckPath,
                  http20Enabled: .siteConfig.http20Enabled,
                  numberOfWorkers: .siteConfig.numberOfWorkers,
                  vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                  ipSecurityRestrictions:
                    ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                  scmIpSecurityRestrictions:
                    ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                }
              }' |
              sha256_stream
          }

          config="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query '{image:linuxFxVersion}' \
            --output json)"

          actual_acr_login_server="$(az acr show \
            --name "$ACR" \
            --query loginServer \
            --output tsv)"
          [[ "$actual_acr_login_server" == "$ACR_LOGIN_SERVER" ]]
          configured_ref="$(jq -r '.image' <<<"$config")"
          configured_ref="${configured_ref#DOCKER|}"
          expected_prefix="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY"
          case "$configured_ref" in
            "$expected_prefix"@sha256:*)
              previous_ref="$configured_ref"
              previous_digest="${configured_ref##*@}"
              ;;
            "$expected_prefix":*)
              previous_spec="${configured_ref#"$ACR_LOGIN_SERVER/"}"
              previous_digest="$(az acr repository show \
                --name "$ACR" \
                --image "$previous_spec" \
                --query digest \
                --output tsv)"
              previous_ref="$expected_prefix@$previous_digest"
              ;;
            *)
              echo "::error::Current image is outside the ShapePilot ACR repository"
              exit 1
              ;;
          esac
          [[ "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$previous_ref" =~ $image_pattern ]]

          previous_latest_digest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" \
            --query digest \
            --output tsv)"
          [[ "$previous_latest_digest" == "$previous_digest" ]]

          app_settings_hash="$(app_settings_snapshot_hash)"
          site_invariants_hash="$(site_snapshot_hash)"
          echo "::add-mask::$app_settings_hash"
          echo "::add-mask::$site_invariants_hash"
          {
            echo "PREVIOUS_IMAGE_REFERENCE=$previous_ref"
            echo "PREVIOUS_IMAGE_DIGEST=$previous_digest"
            echo "PREVIOUS_LATEST_DIGEST=$previous_latest_digest"
            echo "APP_SETTINGS_BASELINE_SHA256=$app_settings_hash"
            echo "SITE_INVARIANTS_BASELINE_SHA256=$site_invariants_hash"
            echo "DEPLOYMENT_MUTATED=false"
          } >> "$GITHUB_ENV"

      - name: Validate first-release baseline
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' && env.INITIAL_DEPLOYMENT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          config="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query '{image:linuxFxVersion}' \
            --output json)"

          actual_acr_login_server="$(az acr show \
            --name "$ACR" \
            --query loginServer \
            --output tsv)"
          [[ "$actual_acr_login_server" == "$ACR_LOGIN_SERVER" ]]
          configured_ref="$(jq -r '.image' <<<"$config")"
          configured_ref="${configured_ref#DOCKER|}"
          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$configured_ref" =~ $image_pattern ]]
          initial_digest="${configured_ref##*@}"
          published_digest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY@$initial_digest" \
            --query digest \
            --output tsv)"
          [[ "$published_digest" == "$initial_digest" ]]

          repository_exists="$(az acr repository list \
            --name "$ACR" \
            --query "contains(@, '$IMAGE_REPOSITORY')" \
            --output tsv)"
          latest_count=0
          if [[ "$repository_exists" == "true" ]]; then
            latest_count="$(az acr repository show-tags \
              --name "$ACR" \
              --repository "$IMAGE_REPOSITORY" \
              --query "[?@=='latest'] | length(@)" \
              --output tsv)"
          fi
          [[ "$latest_count" == "0" ]]

          live_status="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
            -o /dev/null \
            -w '%{http_code}' \
            "$PRODUCTION_URL$LIVE_PATH?initial-proof=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            2>/dev/null || true)"
          if [[ "$live_status" =~ ^2 ]]; then
            echo "::error::Initial deployment is forbidden for an already-live app"
            exit 1
          fi

          sha256_stream() { sha256sum | awk '{print $1}'; }
          app_settings_hash="$(
            az webapp config appsettings list \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS 'sort_by(.name) |
                map({name, value, slotSetting: (.slotSetting // false)})' |
              sha256_stream
          )"
          site_invariants_hash="$(
            az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS '{
                identity: .identity,
                httpsOnly: .httpsOnly,
                publicNetworkAccess: .publicNetworkAccess,
                virtualNetworkSubnetId: .virtualNetworkSubnetId,
                outboundVnetRouting: .outboundVnetRouting,
                clientCertEnabled: .clientCertEnabled,
                siteConfig: {
                  acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                  alwaysOn: .siteConfig.alwaysOn,
                  healthCheckPath: .siteConfig.healthCheckPath,
                  http20Enabled: .siteConfig.http20Enabled,
                  numberOfWorkers: .siteConfig.numberOfWorkers,
                  vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                  ipSecurityRestrictions:
                    ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                  scmIpSecurityRestrictions:
                    ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                }
              }' |
              sha256_stream
          )"
          echo "::add-mask::$app_settings_hash"
          echo "::add-mask::$site_invariants_hash"
          {
            echo "PREVIOUS_IMAGE_REFERENCE="
            echo "PREVIOUS_IMAGE_DIGEST="
            echo "PREVIOUS_LATEST_DIGEST="
            echo "PREVIOUS_HEALTH_SHA="
            echo "PREVIOUS_BUILD_ID="
            echo "PREVIOUS_INSTANCE_ID="
            echo "INITIAL_IMAGE_REFERENCE=$configured_ref"
            echo "APP_SETTINGS_BASELINE_SHA256=$app_settings_hash"
            echo "SITE_INVARIANTS_BASELINE_SHA256=$site_invariants_hash"
            echo "DEPLOYMENT_MUTATED=false"
          } >> "$GITHUB_ENV"

      - name: Diagnostic - skip readiness without a running release
        if: ${{ env.PUBLISH_IMAGE_ONLY == 'true' || env.INITIAL_DEPLOYMENT == 'true' }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: readiness-precondition-precheck
          category: readiness-precondition
          phase: pre-activation
          mode: skip
          reason: Image-only publication and first activation require no running prior release.
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Warn that readiness diagnostic was skipped
        if: ${{ env.PUBLISH_IMAGE_ONLY == 'true' || env.INITIAL_DEPLOYMENT == 'true' }}
        run: >-
          echo "::warning title=Deployment diagnostic skipped - readiness-precondition-precheck::There
          is no running prior release on the image-only or first-activation path;
          the skip is recorded and does not block the release."

      - name: Diagnostic - recovery precondition
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' && env.INITIAL_DEPLOYMENT != 'true' }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: recovery-precondition-precheck
          category: recovery-precondition
          phase: pre-activation
          report: reports/recovery-precondition.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '120000'
          run: |
            npm run --silent deploy:precheck -- recovery \
              --base-url "$PRODUCTION_URL" \
              --resource-group "$RG" \
              --webapp "$WEBAPP" \
              --report reports/recovery-precondition.json

      - name: Diagnostic - skip recovery without a running release
        if: ${{ env.PUBLISH_IMAGE_ONLY == 'true' || env.INITIAL_DEPLOYMENT == 'true' }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: recovery-precondition-precheck
          category: recovery-precondition
          phase: pre-activation
          mode: skip
          reason: Image-only publication and first activation have no running prior release to inspect.
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Warn that recovery diagnostic was skipped
        if: ${{ env.PUBLISH_IMAGE_ONLY == 'true' || env.INITIAL_DEPLOYMENT == 'true' }}
        run: >-
          echo "::warning title=Deployment diagnostic skipped - recovery-precondition-precheck::There
          is no running prior release on the image-only or first-activation path;
          the skip is recorded and does not block the release."

      - name: Build and inspect unique immutable candidate
        id: image
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # The release counter shown in the app. Derived from the workflow's own
          # monotonic run number rather than committed back to the repository:
          # a job that can push to main is a far larger grant than a build
          # number is worth, and this pipeline holds deploy credentials.
          # BUILD_NUMBER_BASELINE is the run number that preceded build 1.
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER - BUILD_NUMBER_BASELINE ))
          candidate_tag="$GITHUB_SHA-$BUILD_ID"
          candidate="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$candidate_tag"
          commit_timestamp="$(
            git show -s --format=%cI "$GITHUB_SHA" |
              xargs -I{} node -e 'console.log(new Date(process.argv[1]).toISOString())' '{}'
          )"
          repository_exists="$(az acr repository list \
            --name "$ACR" \
            --query "contains(@, '$IMAGE_REPOSITORY')" \
            --output tsv)"
          existing_candidate_count=0
          if [[ "$repository_exists" == "true" ]]; then
            existing_candidate_count="$(az acr repository show-tags \
              --name "$ACR" \
              --repository "$IMAGE_REPOSITORY" \
              --query "[?@=='$candidate_tag'] | length(@)" \
              --output tsv)"
          fi
          [[ "$existing_candidate_count" == "0" ]]

          az acr login --name "$ACR"
          docker build --pull \
            --tag "$candidate" \
            --build-arg "BUILD_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_ID=$BUILD_ID" \
            --build-arg "BUILD_NUMBER=$BUILD_NUMBER" \
            --build-arg "BUILD_TIMESTAMP=$commit_timestamp" \
            --build-arg "VITE_AZURE_CLIENT_ID=$VITE_AZURE_CLIENT_ID" \
            --build-arg "VITE_AZURE_TENANT_ID=$VITE_AZURE_TENANT_ID" \
            --build-arg "VITE_API_SCOPE=api://60b0b8cf-f1e2-4ba4-b89b-7d6dc3358251/access_as_user" \
            .
          docker push "$candidate"

          digest=""
          for _attempt in $(seq 1 30); do
            digest="$(az acr repository show \
              --name "$ACR" \
              --image "$IMAGE_REPOSITORY:$candidate_tag" \
              --query digest \
              --output tsv 2>/dev/null || true)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            sleep 2
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          image_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$digest"
          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$image_ref" =~ $image_pattern ]]
          docker pull "$image_ref"
          docker image inspect "$image_ref" \
            --format '{{json .RepoDigests}}' |
            jq -e --arg ref "$image_ref" 'index($ref) != null' > /dev/null
          docker image inspect "$image_ref" \
            --format '{{json .Config.Volumes}}' |
            jq -e '[((. // {}) | keys[]) |
              select(. == "/home" or startswith("/home/"))] | length == 0'

          revision="$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          image_build_id="$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          [[ "$revision" == "$GITHUB_SHA" ]]
          [[ "$image_build_id" == "$BUILD_ID" ]]
          {
            echo "digest=$digest"
            echo "ref=$image_ref"
            echo "build_id=$BUILD_ID"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_DIGEST=$digest"
            echo "IMAGE_REFERENCE=$image_ref"
            echo "BUILD_ID=$BUILD_ID"
            echo "DIAGNOSTIC_BUILD_ID=$BUILD_ID"
            echo "DIAGNOSTIC_CANDIDATE_DIGEST=$digest"
          } >> "$GITHUB_ENV"

      - name: Generate exact-image SBOM
        id: image-sbom
        continue-on-error: true
        timeout-minutes: 10
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: evidence/image-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Diagnostic - record exact-image SBOM
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: image-sbom
          category: sbom
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image-sbom.outcome == 'success' && '0' || '1' }}
          report: evidence/image-sbom.spdx.json
          report-format: spdx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Scan exact image for HIGH and CRITICAL vulnerabilities
        id: image-scan
        continue-on-error: true
        timeout-minutes: 12
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: json
          output: reports/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln
          timeout: 10m
          exit-code: '0'

      - name: Diagnostic - record image vulnerability scan
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: image-vulnerability-scan
          category: image-scan
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image-scan.outcome == 'success' && '0' || '1' }}
          report: reports/trivy-image.json
          report-format: trivy-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Install Cosign for diagnostic verification
        id: cosign
        continue-on-error: true
        timeout-minutes: 5
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Diagnostic - signature verification
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: signature-verification
          category: signature-provenance
          phase: pre-activation
          report: reports/signature-verification.json
          report-format: generic-json
          evidence: reports/cosign-signature.json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '120000'
          run: |
            set -uo pipefail
            rm -f reports/cosign-signature.json reports/signature-verification.json
            workflow_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}"
            signature_output="$(cosign verify \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REFERENCE" 2>&1)"
            signature_status=$?
            printf '%s\n' "$signature_output" >&2
            verified=false
            if [[ "$signature_status" -eq 0 ]]; then
              verified=true
              printf '%s\n' "$signature_output" > reports/cosign-signature.json
            fi
            jq -n \
              --arg tool cosign \
              --arg identity "$workflow_identity" \
              --arg issuer https://token.actions.githubusercontent.com \
              --argjson verified "$verified" \
              --argjson exitCode "$signature_status" \
              '{
                tool: $tool,
                certificate_identity: $identity,
                certificate_oidc_issuer: $issuer,
                verified: $verified,
                exit_code: $exitCode
              }' > reports/signature-verification.json
            exit "$signature_status"

      - name: Diagnostic - provenance and SBOM attestation verification
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: provenance-attestation-verification
          category: signature-provenance
          phase: pre-activation
          report: reports/attestation-verification.json
          report-format: generic-json
          evidence: |
            reports/cosign-provenance.json
            reports/cosign-sbom-attestation.json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '180000'
          run: |
            set -uo pipefail
            rm -f reports/cosign-provenance.json \
              reports/cosign-sbom-attestation.json \
              reports/attestation-verification.json
            workflow_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}"

            provenance_output="$(cosign verify-attestation \
              --type slsaprovenance1 \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REFERENCE" 2>&1)"
            provenance_status=$?
            printf '%s\n' "$provenance_output" >&2
            if [[ "$provenance_status" -eq 0 ]]; then
              printf '%s\n' "$provenance_output" > reports/cosign-provenance.json
            fi

            sbom_output="$(cosign verify-attestation \
              --type spdxjson \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REFERENCE" 2>&1)"
            sbom_status=$?
            printf '%s\n' "$sbom_output" >&2
            if [[ "$sbom_status" -eq 0 ]]; then
              printf '%s\n' "$sbom_output" > reports/cosign-sbom-attestation.json
            fi

            verified=false
            combined_status=1
            if [[ "$provenance_status" -eq 0 && "$sbom_status" -eq 0 ]]; then
              verified=true
              combined_status=0
            elif [[ "$provenance_status" -eq 126 || "$provenance_status" -eq 127 ]]; then
              combined_status="$provenance_status"
            elif [[ "$sbom_status" -eq 126 || "$sbom_status" -eq 127 ]]; then
              combined_status="$sbom_status"
            fi
            jq -n \
              --arg tool cosign \
              --arg identity "$workflow_identity" \
              --argjson verified "$verified" \
              --argjson provenanceExitCode "$provenance_status" \
              --argjson sbomExitCode "$sbom_status" \
              '{
                tool: $tool,
                certificate_identity: $identity,
                verified: $verified,
                attestations: {
                  slsaprovenance1: $provenanceExitCode,
                  spdxjson: $sbomExitCode
                }
              }' > reports/attestation-verification.json
            exit "$combined_status"

      - name: Verify immutable ShapePilot image before activation
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent deploy:acr-check -- \
            --registry "$ACR" \
            --login-server "$ACR_LOGIN_SERVER" \
            --resource-group "$RG" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --repository "$IMAGE_REPOSITORY" \
            > /dev/null
          candidate_tag="$GITHUB_SHA-$BUILD_ID"
          published_digest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:$candidate_tag" \
            --query digest \
            --output tsv)"
          [[ "$published_digest" == "$IMAGE_DIGEST" ]]
          [[ "$IMAGE_REFERENCE" == "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$IMAGE_DIGEST" ]]

      - name: Record immutable image-only publication
        if: ${{ env.PUBLISH_IMAGE_ONLY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg contract "$DEPLOYMENT_CONTRACT_VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg buildId "$BUILD_ID" \
            --arg image "$IMAGE_REFERENCE" \
            --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{
              contract: $contract,
              repository: $repository,
              sha: $sha,
              buildId: $buildId,
              image: $image,
              workflowRun: $run,
              imageOnly: true,
              immutableDigestVerified: true
            }' > evidence/image-publication.json

      - name: Preload rollback image before production mutation
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INITIAL_DEPLOYMENT" == "true" ]]; then
            docker pull "$INITIAL_IMAGE_REFERENCE"
          else
            docker pull "$PREVIOUS_IMAGE_REFERENCE"
            previous_sha="$(docker image inspect "$PREVIOUS_IMAGE_REFERENCE" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            previous_build_id="$(docker image inspect "$PREVIOUS_IMAGE_REFERENCE" \
              --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
            [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$previous_build_id" =~ ^[0-9]+-[0-9]+$ ]]
            {
              echo "PREVIOUS_HEALTH_SHA=$previous_sha"
              echo "PREVIOUS_BUILD_ID=$previous_build_id"
            } >> "$GITHUB_ENV"
            docker tag \
              "$PREVIOUS_IMAGE_REFERENCE" \
              "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          fi

      - name: Diagnostic - pre-activation readiness
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' && env.INITIAL_DEPLOYMENT != 'true' }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: readiness-precondition-precheck
          category: readiness-precondition
          phase: pre-activation
          report: reports/readiness-precondition.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}
          timeout-ms: '300000'
          run: |
            npm run --silent deploy:precheck -- readiness \
              --base-url "$PRODUCTION_URL" \
              --expected-sha "$PREVIOUS_HEALTH_SHA" \
              --expected-build-id "$PREVIOUS_BUILD_ID" \
              --attempts 12 \
              --confirmations "$REQUIRED_CONFIRMATIONS" \
              --interval-ms "$((POLL_INTERVAL_SECONDS * 1000))" \
              --request-timeout-ms "$((HTTP_TIMEOUT_SECONDS * 1000))" \
              --run-token "predeploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --report reports/readiness-precondition.json

      - name: Retain prior process identity when readiness observed it
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' && env.INITIAL_DEPLOYMENT != 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          previous_instance_id="$(
            jq -er '
              select(.ok == true) |
              .instance_id |
              select(type == "string" and test("^[A-Za-z0-9._:-]+$"))
            ' reports/readiness-precondition.json 2>/dev/null || true
          )"
          if [[ -n "$previous_instance_id" ]]; then
            echo "PREVIOUS_INSTANCE_ID=$previous_instance_id" >> "$GITHUB_ENV"
          else
            echo "::warning title=Readiness diagnostic metadata::A prior process identity was not observed; activation remains non-blocking and post-activation verification retains process-absence proof."
          fi

      - name: Arm rollback before production mutation
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(date +%s)" -lt "$MUTATION_START_DEADLINE_EPOCH" ]]
          echo "DEPLOYMENT_MUTATED=true" >> "$GITHUB_ENV"

      - name: Activate inspected digest as production canary
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          stop_sqlite_app() {
            az webapp stop \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output none
            absent_rounds=0
            for _attempt in $(seq 1 60); do
              state="$(az webapp show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query state \
                --output tsv)"
              status="$(curl -sS --max-time 3 \
                -o /dev/null \
                -w '%{http_code}' \
                "$PRODUCTION_URL$LIVE_PATH?stop-proof=$GITHUB_RUN_ID-$_attempt" \
                2>/dev/null || true)"
              if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
                absent_rounds=$((absent_rounds + 1))
                [[ "$absent_rounds" -ge 3 ]] && return
              else
                absent_rounds=0
              fi
              sleep 2
            done
            echo "::error::Old SQLite process did not become observably absent"
            return 1
          }

          stop_sqlite_app
          az webapp config container set \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --container-image-name "$IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --output none
          configured="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query linuxFxVersion \
            --output tsv)"
          [[ "$configured" == "DOCKER|$IMAGE_REFERENCE" ]]
          az webapp start \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output none

      - name: Verify candidate version, liveness, and readiness
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          verify_args=(
            --base-url "$PRODUCTION_URL"
            --live-path "$LIVE_PATH"
            --ready-path "$READY_PATH"
            --profile "$DEPLOYMENT_PROFILE"
            --expected-sha "$GITHUB_SHA"
            --expected-build-id "$BUILD_ID"
            --attempts "$MAX_ATTEMPTS"
            --confirmations "$REQUIRED_CONFIRMATIONS"
            --interval-ms "$((POLL_INTERVAL_SECONDS * 1000))"
            --request-timeout-ms "$((HTTP_TIMEOUT_SECONDS * 1000))"
            --run-token "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          )
          if [[ "$INITIAL_DEPLOYMENT" != "true" && -n "${PREVIOUS_INSTANCE_ID:-}" ]]; then
            verify_args+=(--previous-instance-id "$PREVIOUS_INSTANCE_ID")
          fi
          node scripts/verify-deployment.mjs "${verify_args[@]}"

      - name: Verify protected configuration stayed unchanged
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sha256_stream() { sha256sum | awk '{print $1}'; }
          settings_after="$(
            az webapp config appsettings list \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS 'sort_by(.name) |
                map({name, value, slotSetting: (.slotSetting // false)})' |
              sha256_stream
          )"
          site_after="$(
            az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output json |
              jq -cS '{
                identity: .identity,
                httpsOnly: .httpsOnly,
                publicNetworkAccess: .publicNetworkAccess,
                virtualNetworkSubnetId: .virtualNetworkSubnetId,
                outboundVnetRouting: .outboundVnetRouting,
                clientCertEnabled: .clientCertEnabled,
                siteConfig: {
                  acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                  alwaysOn: .siteConfig.alwaysOn,
                  healthCheckPath: .siteConfig.healthCheckPath,
                  http20Enabled: .siteConfig.http20Enabled,
                  numberOfWorkers: .siteConfig.numberOfWorkers,
                  vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                  ipSecurityRestrictions:
                    ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                  scmIpSecurityRestrictions:
                    ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                }
              }' |
              sha256_stream
          )"
          [[ "$settings_after" == "$APP_SETTINGS_BASELINE_SHA256" ]]
          [[ "$site_after" == "$SITE_INVARIANTS_BASELINE_SHA256" ]]
          configured="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query linuxFxVersion \
            --output tsv)"
          [[ "$configured" == "DOCKER|$IMAGE_REFERENCE" ]]

      - name: Promote verified digest without rebuilding
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          latest_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          docker pull "$IMAGE_REFERENCE"
          docker tag "$IMAGE_REFERENCE" "$latest_ref"
          docker push "$latest_ref"
          promoted="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" \
            --query digest \
            --output tsv)"
          [[ "$promoted" == "$IMAGE_DIGEST" ]]

      - name: Confirm promoted release and monitoring
        if: ${{ env.PUBLISH_IMAGE_ONLY != 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-deployment.mjs \
            --base-url "$PRODUCTION_URL" \
            --live-path "$LIVE_PATH" \
            --ready-path "$READY_PATH" \
            --profile "$DEPLOYMENT_PROFILE" \
            --expected-sha "$GITHUB_SHA" \
            --expected-build-id "$BUILD_ID" \
            --attempts 12 \
            --confirmations "$REQUIRED_CONFIRMATIONS" \
            --interval-ms "$((POLL_INTERVAL_SECONDS * 1000))" \
            --request-timeout-ms "$((HTTP_TIMEOUT_SECONDS * 1000))" \
            --run-token "promoted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          monitor_phase=postdeploy
          if [[ "$INITIAL_DEPLOYMENT" == "true" ]]; then
            monitor_phase=initial-postdeploy
          fi
          npm run deploy:monitor-check -- \
            --phase "$monitor_phase" \
            --resource-group "$RG" \
            --webapp "$WEBAPP" \
            --base-url "$PRODUCTION_URL"
          npm run --silent deploy:acr-check -- \
            --registry "$ACR" \
            --login-server "$ACR_LOGIN_SERVER" \
            --resource-group "$RG" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --repository "$IMAGE_REPOSITORY" \
            > /dev/null

          jq -n \
            --arg contract "$DEPLOYMENT_CONTRACT_VERSION" \
            --arg profile "$DEPLOYMENT_PROFILE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg buildId "$BUILD_ID" \
            --arg image "$IMAGE_REFERENCE" \
            --arg previous "${PREVIOUS_IMAGE_REFERENCE:-}" \
            --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{
              contract: $contract,
              profile: $profile,
              repository: $repository,
              sha: $sha,
              buildId: $buildId,
              image: $image,
              previousImage: $previous,
              workflowRun: $run,
              confirmations: 3,
              settingsUnchanged: true,
              siteInvariantsUnchanged: true,
              rollbackPerformed: false
            }' > evidence/deployment.json

      - name: Select cancellation-safe rollback budget
        if: ${{ cancelled() }}
        run: echo "ROLLBACK_CANCELLED=true" >> "$GITHUB_ENV"

      - name: Restore prior release after failure or cancellation
        if: ${{ always() && env.PUBLISH_IMAGE_ONLY != 'true' && (failure() || cancelled()) && env.DEPLOYMENT_MUTATED == 'true' && env.INITIAL_DEPLOYMENT != 'true' }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "::warning::Restoring prior immutable release"
          stop_attempts=60
          stop_sleep_seconds=2
          verify_attempts="$ROLLBACK_MAX_ATTEMPTS"
          verify_interval_ms=3000
          verify_timeout_ms=4000
          if [[ "$ROLLBACK_CANCELLED" == "true" ]]; then
            rollback_pid=$$
            (sleep 230; kill -TERM "$rollback_pid") &
            watchdog_pid=$!
            trap 'kill "$watchdog_pid" >/dev/null 2>&1 || true' EXIT
            az() { command timeout 8s az "$@"; }
            docker() { command timeout 45s docker "$@"; }
            stop_attempts=4
            stop_sleep_seconds=1
            verify_attempts=15
            verify_interval_ms=1000
            verify_timeout_ms=3000
          fi
          stop_sqlite_app() {
            az webapp stop \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output none
            absent_rounds=0
            for _attempt in $(seq 1 "$stop_attempts"); do
              state="$(az webapp show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query state \
                --output tsv)"
              status="$(curl -sS --max-time 3 \
                -o /dev/null \
                -w '%{http_code}' \
                "$PRODUCTION_URL$LIVE_PATH?rollback-stop-proof=$GITHUB_RUN_ID-$_attempt" \
                2>/dev/null || true)"
              if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
                absent_rounds=$((absent_rounds + 1))
                [[ "$absent_rounds" -ge 3 ]] && return
              else
                absent_rounds=0
              fi
              sleep "$stop_sleep_seconds"
            done
            echo "::error::Candidate SQLite process did not become observably absent"
            return 1
          }

          stop_sqlite_app
          az webapp config container set \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --container-image-name "$PREVIOUS_IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --output none
          az webapp start \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output none

          previous_latest_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$PREVIOUS_LATEST_DIGEST"
          latest_ref="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$previous_latest_ref" =~ $image_pattern ]]
          if [[ "$ROLLBACK_CANCELLED" != "true" ]]; then
            docker pull "$previous_latest_ref"
          fi
          docker tag "$previous_latest_ref" "$latest_ref"
          docker push "$latest_ref"
          configured="$(az webapp config show \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --query linuxFxVersion \
            --output tsv)"
          restored_latest="$(az acr repository show \
            --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" \
            --query digest \
            --output tsv)"
          [[ "$configured" == "DOCKER|$PREVIOUS_IMAGE_REFERENCE" ]]
          [[ "$restored_latest" == "$PREVIOUS_LATEST_DIGEST" ]]

          node scripts/verify-deployment.mjs \
            --base-url "$PRODUCTION_URL" \
            --live-path "$LIVE_PATH" \
            --ready-path "$READY_PATH" \
            --profile "$DEPLOYMENT_PROFILE" \
            --expected-sha "$PREVIOUS_HEALTH_SHA" \
            --expected-build-id "$PREVIOUS_BUILD_ID" \
            --attempts "$verify_attempts" \
            --confirmations "$REQUIRED_CONFIRMATIONS" \
            --interval-ms "$verify_interval_ms" \
            --request-timeout-ms "$verify_timeout_ms" \
            --run-token "rollback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          if [[ "$ROLLBACK_CANCELLED" != "true" ]]; then
            sha256_stream() { sha256sum | awk '{print $1}'; }
            settings_after="$(
              az webapp config appsettings list \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --output json |
                jq -cS 'sort_by(.name) |
                  map({name, value, slotSetting: (.slotSetting // false)})' |
                sha256_stream
            )"
            site_after="$(
              az webapp show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --output json |
                jq -cS '{
                  identity: .identity,
                  httpsOnly: .httpsOnly,
                  publicNetworkAccess: .publicNetworkAccess,
                  virtualNetworkSubnetId: .virtualNetworkSubnetId,
                  outboundVnetRouting: .outboundVnetRouting,
                  clientCertEnabled: .clientCertEnabled,
                  siteConfig: {
                    acrUseManagedIdentityCreds: .siteConfig.acrUseManagedIdentityCreds,
                    alwaysOn: .siteConfig.alwaysOn,
                    healthCheckPath: .siteConfig.healthCheckPath,
                    http20Enabled: .siteConfig.http20Enabled,
                    numberOfWorkers: .siteConfig.numberOfWorkers,
                    vnetRouteAllEnabled: .siteConfig.vnetRouteAllEnabled,
                    ipSecurityRestrictions:
                      ((.siteConfig.ipSecurityRestrictions // []) | sort_by(.priority, .name)),
                    scmIpSecurityRestrictions:
                      ((.siteConfig.scmIpSecurityRestrictions // []) | sort_by(.priority, .name))
                  }
                }' |
                sha256_stream
            )"
            [[ "$settings_after" == "$APP_SETTINGS_BASELINE_SHA256" ]]
            [[ "$site_after" == "$SITE_INVARIANTS_BASELINE_SHA256" ]]
            npm run deploy:monitor-check -- \
              --phase rollback \
              --resource-group "$RG" \
              --webapp "$WEBAPP" \
              --base-url "$PRODUCTION_URL"
            npm run --silent deploy:acr-check -- \
              --registry "$ACR" \
              --login-server "$ACR_LOGIN_SERVER" \
              --resource-group "$RG" \
              --subscription-id "$AZURE_SUBSCRIPTION_ID" \
              --repository "$IMAGE_REPOSITORY" \
              > /dev/null
          fi
          jq -n \
            --arg image "$PREVIOUS_IMAGE_REFERENCE" \
            --arg sha "$PREVIOUS_HEALTH_SHA" \
            --arg buildId "$PREVIOUS_BUILD_ID" \
            --arg cancelled "$ROLLBACK_CANCELLED" \
            '{
              rollbackPerformed: true,
              restoredImage: $image,
              restoredSha: $sha,
              restoredBuildId: $buildId,
              confirmations: 3,
              settingsUnchanged: true,
              monitoringChecked: ($cancelled == "false"),
              cancellationBudget: ($cancelled == "true")
            }' > evidence/rollback.json

      - name: Stop failed first-release candidate
        if: ${{ always() && env.PUBLISH_IMAGE_ONLY != 'true' && (failure() || cancelled()) && env.DEPLOYMENT_MUTATED == 'true' && env.INITIAL_DEPLOYMENT == 'true' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          stop_attempts=60
          stop_sleep_seconds=2
          if [[ "$ROLLBACK_CANCELLED" == "true" ]]; then
            rollback_pid=$$
            (sleep 230; kill -TERM "$rollback_pid") &
            watchdog_pid=$!
            trap 'kill "$watchdog_pid" >/dev/null 2>&1 || true' EXIT
            az() { command timeout 8s az "$@"; }
            stop_attempts=4
            stop_sleep_seconds=1
          fi
          stop_sqlite_app() {
            az webapp stop \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --output none
            absent_rounds=0
            for _attempt in $(seq 1 "$stop_attempts"); do
              state="$(az webapp show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query state \
                --output tsv)"
              status="$(curl -sS --max-time 3 \
                -o /dev/null \
                -w '%{http_code}' \
                "$PRODUCTION_URL$LIVE_PATH?failed-initial-stop-proof=$GITHUB_RUN_ID-$_attempt" \
                2>/dev/null || true)"
              if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
                absent_rounds=$((absent_rounds + 1))
                [[ "$absent_rounds" -ge 3 ]] && return
              else
                absent_rounds=0
              fi
              sleep "$stop_sleep_seconds"
            done
            echo "::error::Failed initial SQLite process did not become observably absent"
            return 1
          }

          stop_sqlite_app

          image_pattern="^$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@sha256:[0-9a-f]{64}$"
          [[ "$INITIAL_IMAGE_REFERENCE" =~ $image_pattern ]]
          az webapp config container set \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --container-image-name "$INITIAL_IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --output none

          repository_exists="$(az acr repository list \
            --name "$ACR" \
            --query "contains(@, '$IMAGE_REPOSITORY')" \
            --output tsv)"
          latest_count=0
          if [[ "$repository_exists" == "true" ]]; then
            latest_count="$(az acr repository show-tags \
              --name "$ACR" \
              --repository "$IMAGE_REPOSITORY" \
              --query "[?@=='latest'] | length(@)" \
              --output tsv)"
          fi
          if [[ "$latest_count" == "1" ]]; then
            failed_latest="$(az acr repository show \
              --name "$ACR" \
              --image "$IMAGE_REPOSITORY:latest" \
              --query digest \
              --output tsv)"
            [[ "$failed_latest" == "$IMAGE_DIGEST" ]]
            az acr repository untag \
              --name "$ACR" \
              --image "$IMAGE_REPOSITORY:latest"
          elif [[ "$latest_count" != "0" ]]; then
            echo "::error::Unexpected duplicate latest tags"
            exit 1
          fi

          az webapp stop \
            --resource-group "$RG" \
            --name "$WEBAPP" \
            --output none

          for _attempt in $(seq 1 "$stop_attempts"); do
            state="$(az webapp show \
              --resource-group "$RG" \
              --name "$WEBAPP" \
              --query state \
              --output tsv)"
            status="$(curl -sS --max-time 3 \
              -o /dev/null \
              -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?failed-initial-proof=$GITHUB_RUN_ID-$_attempt" \
              2>/dev/null || true)"
            if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
              configured="$(az webapp config show \
                --resource-group "$RG" \
                --name "$WEBAPP" \
                --query linuxFxVersion \
                --output tsv)"
              [[ "$configured" == "DOCKER|$INITIAL_IMAGE_REFERENCE" ]]
              if [[ "$repository_exists" == "true" ]]; then
                remaining_latest="$(az acr repository show-tags \
                  --name "$ACR" \
                  --repository "$IMAGE_REPOSITORY" \
                  --query "[?@=='latest'] | length(@)" \
                  --output tsv)"
                [[ "$remaining_latest" == "0" ]]
              fi
              if [[ "$ROLLBACK_CANCELLED" != "true" ]]; then
                npm run --silent deploy:acr-check -- \
                  --registry "$ACR" \
                  --login-server "$ACR_LOGIN_SERVER" \
                  --resource-group "$RG" \
                  --subscription-id "$AZURE_SUBSCRIPTION_ID" \
                  --repository "$IMAGE_REPOSITORY" \
                  > /dev/null
              fi
              jq -n \
                --arg image "$IMAGE_REFERENCE" \
                --arg cancelled "$ROLLBACK_CANCELLED" \
                '{
                  initialDeploymentFailed: true,
                  failedImage: $image,
                  appStopped: true,
                  priorReleaseAvailable: false,
                  initialRetryReady: true,
                  cancellationBudget: ($cancelled == "true")
                }' > evidence/rollback.json
              exit 0
            fi
            sleep "$stop_sleep_seconds"
          done
          echo "::error::Failed initial candidate did not stop"
          exit 1

      - name: Aggregate deployment diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-activation
          mode: aggregate
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Upload deployment diagnostic evidence
        id: upload-deployment-diagnostics
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-diagnostics/
            reports/
            evidence/image-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

      - name: Warn if deployment diagnostic evidence upload failed
        if: ${{ always() && steps.upload-deployment-diagnostics.outcome == 'failure' }}
        run: >-
          echo "::warning title=Deployment diagnostics upload::The best-effort deployment
          diagnostic evidence upload failed; findings remain visible in warnings
          and the job summary."

      - name: Upload nonsecret deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false
